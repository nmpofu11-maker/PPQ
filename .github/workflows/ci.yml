name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Firestore rules tests (emulator)
        run: npx firebase-tools emulators:exec --only firestore --project demo-ppq "npm run test:rules"
      - run: npm run build
      - name: Smoke-test the production server
        run: |
          PORT=3100 node dist-server/server.js &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3100/api/health && exit 0; sleep 1; done
          exit 1
